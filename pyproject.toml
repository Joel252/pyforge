[project]
name = "pyforge"
version = "0.1.0"
description = "Lightweight Python project scaffolding and developer tooling."
readme = "README.md"
authors = [
    { name = "Joel252", email = "joel.enrique.cruz860@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
pyforge = "pyforge.cli:app"
